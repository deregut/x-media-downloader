# X Media Grab — Netlify configuration
# Static site (public/) + two zero-dependency serverless functions (functions/).

[build]
  command = "test -f public/js/app.js && test -f functions/tweet.js && test -f functions/media.js"
  publish = "public"
  functions = "functions"

[build.environment]
  NODE_VERSION = "24"

[dev]
  port = 8888
  targetPort = 8888

# Redirect /api/* to Netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
