# X Media Grab — Netlify configuration
# Static site (public/) + two zero-dependency serverless functions (functions/).

[build]
  command = "echo 'No build needed — static site + serverless functions'"
  publish = "public"
  functions = "functions"

[build.environment]
  NODE_VERSION = "18"

[dev]
  port = 8888
  targetPort = 8888
